<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif">
<title id="t">導入の手順と初回の実行</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3A5F"/></marker></defs>
<rect width="800" height="340" fill="#FFFFFF"/>
<text x="20" y="28" font-size="14" font-weight="700" fill="#1F3A5F">A. Claude Code で順に実行する</text>
<rect x="20" y="42" width="230" height="100" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="34" y="68" font-size="14" font-weight="700" fill="#1F3A5F">1 マーケットプレイスを追加</text>
<text x="34" y="96" font-size="12" fill="#222222">/plugin marketplace add</text>
<text x="34" y="114" font-size="12" fill="#222222">asama0101/pptx-maker</text>
<rect x="285" y="42" width="230" height="100" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="299" y="68" font-size="14" font-weight="700" fill="#1F3A5F">2 プラグインを入れる</text>
<text x="299" y="96" font-size="12" fill="#222222">/plugin install</text>
<text x="299" y="114" font-size="12" fill="#222222">pptx-maker@pptx-maker</text>
<rect x="550" y="42" width="230" height="100" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="564" y="68" font-size="14" font-weight="700" fill="#1F3A5F">3 読み込み直す</text>
<text x="564" y="96" font-size="12" fill="#222222">/reload-plugins</text>
<text x="564" y="114" font-size="12" fill="#222222">候補に pptx-maker:create が</text>
<text x="564" y="130" font-size="12" fill="#222222">出れば完了</text>
<path d="M250 86 H285" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>
<path d="M515 86 H550" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="178" font-size="14" font-weight="700" fill="#1F3A5F">B. 初回の /pptx-maker:create</text>
<rect x="20" y="192" width="170" height="100" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="34" y="218" font-size="14" font-weight="700" fill="#1F3A5F">環境を診断</text>
<text x="34" y="246" font-size="12" fill="#222222">何も変えない</text>
<rect x="240" y="192" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="254" y="218" font-size="14" font-weight="700" fill="#1F3A5F">取得を承認</text>
<text x="254" y="246" font-size="12" fill="#222222">不足があるときだけ。</text>
<text x="254" y="264" font-size="12" fill="#222222">Claude が聞く</text>
<rect x="460" y="192" width="320" height="100" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="474" y="218" font-size="14" font-weight="700" fill="#1F3A5F">取得して保存</text>
<text x="474" y="244" font-size="12" fill="#222222">ライブラリ: 専用のフォルダ</text>
<text x="474" y="262" font-size="12" fill="#222222">（パソコンの Python は変わらない）</text>
<text x="474" y="280" font-size="12" fill="#222222">Chromium: 共有の場所（数百 MB）</text>
<path d="M190 242 H240" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>
<text x="215" y="232" text-anchor="middle" font-size="12" fill="#333333">不足</text>
<path d="M410 242 H460" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>
<text x="435" y="232" text-anchor="middle" font-size="12" fill="#333333">承認</text>
<text x="20" y="324" font-size="12" fill="#333333">実線の枠: 自動で進む　破線の枠: あなたが承認する</text>
</svg>
