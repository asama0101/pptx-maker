<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif">
<title id="t">できあがるファイルの置き場</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F3A5F"/></marker></defs>
<rect width="800" height="300" fill="#FFFFFF"/>
<rect x="20" y="20" width="760" height="260" rx="3" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<text x="36" y="48" font-size="15" font-weight="700" fill="#1F3A5F">出力先（Claude Code を起動したフォルダ。ローカルのドライブ。UNC は不可）</text>
<rect x="40" y="70" width="320" height="110" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="56" y="98" font-size="15" font-weight="700" fill="#1F3A5F">&lt;成果物名&gt;.pptx</text>
<text x="56" y="126" font-size="13" fill="#222222">PPTX。PowerPoint で開いて直す</text>
<text x="56" y="148" font-size="13" fill="#222222">直した内容は取り込まれない</text>
<rect x="420" y="70" width="340" height="110" rx="3" fill="#E8EEF6" stroke="#1F3A5F" stroke-width="2"/>
<text x="436" y="98" font-size="15" font-weight="700" fill="#1F3A5F">pptx-maker-source/&lt;成果物名&gt;/</text>
<text x="436" y="126" font-size="13" fill="#222222">元データ: 設計図・原稿・</text>
<text x="436" y="148" font-size="13" fill="#222222">スライドの案・選択結果</text>
<path d="M420 125 H360" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>
<text x="390" y="115" text-anchor="middle" font-size="12" fill="#333333">書き出し</text>
<rect x="40" y="206" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="56" y="230" font-size="13" font-weight="700" fill="#1F3A5F">同じ名前があるとき</text>
<text x="56" y="250" font-size="13" fill="#222222">上書きか別名かを聞かれる。上書きした PPTX は戻せない。残したいときは先に別の場所へコピーする</text>
</svg>
