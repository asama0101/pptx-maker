name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r plugins/pptx-maker/requirements.txt
      - run: python -m playwright install chromium
      # 計測は BIZ UDPゴシックで行うので、利用者の環境に合わせて導入する（無いと代替フォントで表が伸びる）
      - name: BIZ UDPゴシックを入れる
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($w in "Regular", "Bold") {
            $f = "BIZUDPGothic-$w.ttf"
            Invoke-WebRequest "https://github.com/googlefonts/morisawa-biz-ud-gothic/raw/main/fonts/ttf/$f" -OutFile "$dir\$f"
            New-ItemProperty "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts" -Name "BIZ UDPGothic $w (TrueType)" -Value "$dir\$f" -Force | Out-Null
          }
      # ブラウザを使うテスト（slow）は時間がかかるので省く
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m "not slow"
